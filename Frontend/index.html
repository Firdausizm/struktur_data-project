<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="BOOKSEARCH — Temukan, nilai, dan ulas buku favoritmu. Cari jutaan buku dari seluruh dunia.">
  <title>BOOKSEARCH — Temukan Buku Favoritmu</title>
  <link rel="stylesheet" href="/css/style.css">
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar">
    <a href="/" class="navbar-brand">XBOOK</a>
    <div class="navbar-nav" id="navbar-nav"></div>
  </nav>

  <!-- Hero -->
  <main class="hero">
    <h1 class="hero-title"><br>INSPIRE THE WORLD</h1>
    <p class="hero-subtitle">
      Berpikir itu sulit, itulah mengapa kebanyakan orang lebih suka menilai. - Tirta 2026
    </p>

    <!-- Search Bar -->
    <div class="search-container" id="search-container">
      <form id="search-form" autocomplete="off">
        <input type="text" class="search-input" id="search-input" placeholder="Cari judul buku, penulis, atau topik..."
          required minlength="1" aria-label="Cari buku">
        <button type="submit" class="search-btn" id="search-btn">CARI</button>
      </form>
      <div class="autocomplete-dropdown" id="autocomplete-dropdown"></div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/home.js"></script>
</body>

</html>
